name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Build native hook
        shell: pwsh
        run: ./native/build.ps1 -Configuration Release -WithProbe

      - name: Build solution
        shell: pwsh
        run: dotnet build ./CulvertProxy.sln -c Release

      - name: Run tests
        shell: pwsh
        run: dotnet test ./tests/Nexsteaduser.CulvertProxy.Tests/Nexsteaduser.CulvertProxy.Tests.csproj -c Release --no-build
