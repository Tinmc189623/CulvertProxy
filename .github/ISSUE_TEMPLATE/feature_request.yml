name: 功能建议
description: 提出可落地的功能、兼容性或性能改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先描述要解决的问题，再描述方案。能说明现有替代做法会更容易评估。

  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - 透明接管 / 进程注入
        - SOCKS5 / HTTP 协议
        - 上游代理 / 链路调度
        - DNS / DoH / fake-IP
        - 路由规则
        - WinUI 界面
        - CLI
        - 构建 / 发布
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前工作流在哪里卡住，影响哪些应用或网络环境
      placeholder: 例如：连接页无法按进程筛选，排查多进程应用时只能在日志里搜索。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明交互、配置或协议层面的预期行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代做法
      description: 目前如何绕过，或为什么现有规则/设置不够用
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: 是否涉及兼容性变化
      options:
        - 不涉及
        - 可能需要配置迁移
        - 需要新增协议或原生能力
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 额外信息
      description: 截图、参考实现、目标 Windows 版本或链路拓扑
    validations:
      required: false
